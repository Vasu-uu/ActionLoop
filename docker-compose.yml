services:
  actionloop:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Demo mode works with no keys. Set LLM_PROVIDER + a key in .env to use a real model.
      CORS_ORIGINS: "http://localhost:8000"
    volumes:
      - actionloop-data:/data
    # To use Ollama running on your host machine, put this in .env:
    #   LLM_PROVIDER=ollama
    #   OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  actionloop-data:
